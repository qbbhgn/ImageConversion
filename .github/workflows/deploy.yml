name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main # 指定触发部署的分支

permissions:
  contents: write # 授予 GitHub Actions 写入仓库的权限，用于部署

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install # 如果用 yarn 或 pnpm，这里也要相应调整

      - name: Build project
        run: npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist # 指定要部署的文件夹，Vite 默认是 dist
